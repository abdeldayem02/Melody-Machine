<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Mood Playlist Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <style>
        /* Custom styles */
        body {
            background-color: #f5f5f5;
            color: #333;
        }
        .navbar {
            background-color: #1DB954;
        }
        .navbar-brand {
            color: #fff !important;
        }
        .container {
            max-width: 800px;
        }
        .rounded-circle {
            border: 3px solid #1DB954;
            padding: 5px;
        }
        h2, h3, h4 {
            color: #1DB954;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: none;
            border-radius: 10px;
        }
        .btn-info, .btn-success {
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" href="#">Mood Playlist Generator</a>
    </nav>

    <div class="container mt-5">
        <!-- User welcome section -->
        <div class="text-center mb-4">
            <h2>Welcome, {{ user_name }}!</h2>
            {% if pfp_url %}
                <img src="{{ pfp_url }}" alt="Profile Picture" class="rounded-circle" width="100">
            {% endif %}
        </div>

        <!-- Search Artist Section -->
        <div class="card p-4 mb-4">
            <h3 class="text-center">Search for Artists</h3>
            <form action="{{ url_for('search_artist') }}" method="POST">
                <div class="form-group">
                    <input type="text" name="artist_name" class="form-control" placeholder="Enter artist name" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-info"><i class="fas fa-search"></i> Search Artist</button>
                </div>
            </form>

            {% if artist_name %}
            <div class="mt-4 text-center">
                <h4>Selected Artist: {{ artist_name }}</h4>
                {% if artist_image %}
                    <img src="{{ artist_image }}" alt="Artist Image" class="img-thumbnail" width="200">
                {% endif %}
            </div>
            {% endif %}
        </div>

        <!-- Create Playlist Section -->
        <div class="card p-4">
            <h3 class="text-center">Create a Mood-Based Playlist</h3>
            <form action="{{ url_for('create_playlist') }}" method="POST">
                <div class="form-group">
                    <label for="mood">Choose a Mood:</label>
                    <select name="mood" class="form-control" required>
                        <option value="happy">Happy</option>
                        <option value="sad">Sad</option>
                        <option value="calm">Calm</option>
                        <option value="energetic">Energetic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="num_songs">Number of Songs:</label>
                    <input type="number" name="num_songs" class="form-control" min="1" max="100" required>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-success"><i class="fas fa-music"></i> Create Playlist</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 mb-3">
        <p>&copy; {{ current_year }} Melody Machine</p>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
